# Test DB : H2 in memory (mode PostgreSQL)
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
quarkus.datasource.username=sa
quarkus.datasource.password=sa

# Recréation automatique du schéma pour tests
quarkus.hibernate-orm.database.generation=drop-and-create

# Désactiver OpenTelemetry exporter (évite les warnings de connexion à localhost:4317)
quarkus.otel.sdk.disabled=true
